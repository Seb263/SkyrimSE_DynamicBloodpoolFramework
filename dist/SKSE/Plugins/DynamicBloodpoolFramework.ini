; Dynamic Bloodpool Framework - Developer Settings
; WARNING: The parameters in this file are intended for advanced users.
; Modifying these values may affect the behavior and stability of the bloodpool system.


[General]
# This parameter determines the verbosity level used by the framework for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# Load resources asynchronously to prevent delays at game startup (1 enable, 0 disable).
bAsynchronousStartup = false

# If enabled, the mod will automatically overwrite or replace invalid script files with valid versions during initialization.
bOverwriteInvalidScripts = true

# If enabled, the mod will extract and save script source files (psc) for debugging or development purposes.
bExtractScriptSources = false


[Core]
# Update rate (frames per second) for the bloodpool animation system.
# Set to -1 to automatically match the game's framerate. Higher values increase animation smoothness but also CPU usage.
iTargetFramerate = 60

# Vertical offset (in world units) applied to bloodpool decals to prevent clipping with surfaces.
# Too low and the decals may intersect the geometry, too high and they may appear to float.
fHeightOffset = 1.5

# Maximum distance (in world units) between the bloodpool and its original reference node (e.g., a dead NPC).
# If this distance is exceeded, the bloodpool will stop animating.
fCancelDistance = 60.0

# Maximum random rotation applied to bloodpool decals (degrees).
fRandomRotationDeg = 20.0


[Stability]
# Distance threshold for bloodpool stability checks.
fDistanceThreshold = 3.0

# Rotation threshold for bloodpool stability checks.
fRotationThreshold = 0.2

# Duration (in seconds) the origin reference must remain stable before the bloodpool is created.
fStableDuration = 1.0

# Maximum time (in seconds) to wait for the origin reference to stabilize before giving up.
fMaxWaitDuration = 30.0

# Time interval (in seconds) between stability checks.
fPollDelay = 0.1


[Decals]
# Name of the root node (NiNode) for the main decal layer.
sLayerBase = Root

# Name of the root node (NiNode) for the extended decal layer.
sLayerExt = RootExt

# Names of the meshes (BSTriShape) composing the main decal layer.
sBaseGeometry = Decal:01,Decal:02,Decal:03,Decal:04

# Names of the meshes (BSTriShape) composing the extended decal layer.
sExtGeometry = DecalExt:01,DecalExt:02,DecalExt:03,DecalExt:04


[Raycast]
# Maximum vertical distance (in world units) that the bloodpool can "climb" over objects or uneven surfaces.
fMaxStepHeight = 5.0

# Maximum upward slope (in degrees) the bloodpool is allowed to climb.
# Low values prevent blood from unrealistically flowing uphill.
fMaxSlopeUp = 8.0

# Maximum downward slope (in degrees) the bloodpool is allowed to descend.
# Higher values allow blood to spread more freely downhill.
fMaxSlopeDown = 55.0

# Multiplier applied to the effective spread radius when evaluating movement across slopes.
# Helps compensate for uneven terrain during propagation.
fSlopeMultiplier = 1.25

# Performs additional raycasts to improve bloodpool placement on uneven or complex terrain.
bAdvancedRaycasting = true

# Validates slopes using the parent node in addition to the current placement surface.
# Helps avoid incorrect spreading across complex geometry.
bCheckSlopeParent = true

# Controls how scaling constraints are enforced during bloodpool expansion.
#   0: Disabled. No additional constraint checks are applied.
#   1: Locked children bounds only. Prevents nodes from moving outside the volume defined by the parent and locked children.
#   2: Strict. Cancels the entire expansion if any node cannot be scaled correctly.
iScalingConstraintMode = 0

# Automatically rotates the bloodpool so its primary expansion direction points downhill (1 enable, 0 disable).
bAutoOrientSlope = true

# Minimum overall ground slope (in degrees) required before automatic orientation is applied.
fAutoOrientSlopeMinDeg = 8.0


[Flow]
# Controls the overall smoothness of the bloodpool expansion animation (from 0.0 to 1.0).
# 1.0 produces perfectly smooth motion, while 0.0 creates the maximum amount of stuttering.
fStability = 0.3

# Probability that a stutter occurs during each animation segment (from 0.0 to 1.0).
# Higher values produce more irregular, viscous-looking flow.
fStutterRate = 0.6

# Controls how sharply the bloodpool slows down when entering a stutter.
# Higher values produce a more pronounced deceleration.
fStutterEaseIn = 0.8

# Controls how quickly the bloodpool accelerates after a stutter.
# Lower values produce a snappier recovery, while higher values make it more gradual.
fStutterEaseOut = 0.3


[Maintenance]
# Maximum number of bloodpools allowed simultaneously.
# If the number of loaded bloodpools exceeds this limit, the farthest ones will be removed first.
iMaxBloodpools = 36

# Fade-out duration in seconds once the bloodpool is marked for removal.
fDespawnDuration = 5.0
